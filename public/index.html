<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>RENOVATEC</title>
    <script>
      (function () {
        var key = "renovatec_user_session_v1";
        var s = sessionStorage.getItem(key);
        var l = localStorage.getItem(key);
        if (s && !l) localStorage.setItem(key, s);
        if (l && !s) {
          sessionStorage.setItem(key, l);
        }

        var session = sessionStorage.getItem("renovatec_user_session_v1");
        var admin = sessionStorage.getItem("adminUser");
        var tallerista = sessionStorage.getItem("talleristaUser");
        if (admin) {
          window.location.replace("admin.html");
          return;
        }
        if (tallerista) {
          window.location.replace("tallerista.html");
          return;
        }
        if (session) {
          window.location.replace("usuario.html");
          return;
        }
        window.location.replace("/acceso.html");
      })();

      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          var session = sessionStorage.getItem("renovatec_user_session_v1");
          var admin = sessionStorage.getItem("adminUser");
          var tallerista = sessionStorage.getItem("talleristaUser");
          if (admin) window.location.replace("admin.html");
          else if (tallerista) window.location.replace("tallerista.html");
          else if (session) window.location.replace("usuario.html");
        }
      });
    </script>
  </head>
  <body></body>
</html>
