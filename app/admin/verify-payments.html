<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - RENOVATEC Verificación de Pagos</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../public/assets/images/logo.ico"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0c1b33 0%, #1a2f4f 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #0c1b33 0%, #f2a900 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .content {
        padding: 30px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: linear-gradient(135deg, #0c1b33 0%, #1a3a5c 100%);
        color: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
      }

      .stat-card h3 {
        font-size: 0.9rem;
        text-transform: uppercase;
        opacity: 0.8;
        margin-bottom: 10px;
      }

      .stat-card .number {
        font-size: 2.5rem;
        font-weight: bold;
        color: #f2a900;
      }

      .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .filters button {
        padding: 10px 20px;
        background: #0c1b33;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
      }

      .filters button.active,
      .filters button:hover {
        background: #f2a900;
        color: #0c1b33;
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        background: #f0f0f0;
      }

      th {
        padding: 15px;
        text-align: left;
        font-weight: 600;
        color: #0c1b33;
        border-bottom: 2px solid #0c1b33;
      }

      td {
        padding: 15px;
        border-bottom: 1px solid #e0e0e0;
      }

      tr:hover {
        background: #f9f9f9;
      }

      .badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
      }

      .badge.pending {
        background: #fff3cd;
        color: #856404;
      }

      .badge.verified {
        background: #d4edda;
        color: #155724;
      }

      .badge.rejected {
        background: #f8d7da;
        color: #721c24;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s;
      }

      .btn-approve {
        background: #28a745;
        color: white;
      }

      .btn-approve:hover {
        background: #218838;
      }

      .btn-reject {
        background: #dc3545;
        color: white;
      }

      .btn-reject:hover {
        background: #c82333;
      }

      .btn-view {
        background: #007bff;
        color: white;
      }

      .btn-view:hover {
        background: #0056b3;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: white;
        border-radius: 12px;
        padding: 30px;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-header {
        font-size: 1.5rem;
        color: #0c1b33;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: #999;
      }

      .close-btn:hover {
        color: #0c1b33;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #0c1b33;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.95rem;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        justify-content: flex-end;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #999;
      }

      .error {
        background: #f8d7da;
        color: #721c24;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border-left: 4px solid #dc3545;
      }

      .success {
        background: #d4edda;
        color: #155724;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border-left: 4px solid #28a745;
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 1.8rem;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        table {
          font-size: 0.9rem;
        }

        th,
        td {
          padding: 10px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1><i class="fas fa-robot"></i> RENOVATEC Admin</h1>
        <p>Verificación de Pagos y Registros</p>
      </div>

      <div class="content">
        <div id="errorMessage" class="error" style="display: none"></div>
        <div id="successMessage" class="success" style="display: none"></div>

        <div class="stats">
          <div class="stat-card">
            <h3>Pendientes</h3>
            <div class="number" id="pendingCount">0</div>
          </div>
          <div class="stat-card">
            <h3>Verificados</h3>
            <div class="number" id="verifiedCount">0</div>
          </div>
          <div class="stat-card">
            <h3>Rechazados</h3>
            <div class="number" id="rejectedCount">0</div>
          </div>
          <div class="stat-card">
            <h3>Ingresos Totales</h3>
            <div class="number" id="totalIncome">$0</div>
          </div>
        </div>

        <div class="filters">
          <button class="active" onclick="filterRegistrations('pending')">
            <i class="fas fa-hourglass-half"></i> Pendientes
          </button>
          <button onclick="filterRegistrations('verified')">
            <i class="fas fa-check-circle"></i> Verificados
          </button>
          <button onclick="filterRegistrations('rejected')">
            <i class="fas fa-times-circle"></i> Rechazados
          </button>
          <button onclick="loadAllRegistrations()">
            <i class="fas fa-sync-alt"></i> Recargar
          </button>
        </div>

        <div class="table-container">
          <table id="registrationsTable">
            <thead>
              <tr>
                <th>Folio</th>
                <th>Capitán</th>
                <th>Escuela</th>
                <th>Robots</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="8" class="loading">
                  <i class="fas fa-spinner fa-spin"></i> Cargando datos...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal para verificar -->
    <div id="verifyModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span>Verificar Pago</span>
          <button class="close-btn" onclick="closeModal('verifyModal')">
            &times;
          </button>
        </div>
        <div id="verifyDetails"></div>
        <div class="form-group">
          <label>Notas (opcional):</label>
          <textarea
            id="verifyNotes"
            placeholder="Agregar notas sobre la verificación..."
          ></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-reject" onclick="closeModal('verifyModal')">
            Cancelar
          </button>
          <button class="btn btn-approve" onclick="submitVerification()">
            Verificar Pago
          </button>
        </div>
      </div>
    </div>

    <!-- Modal para rechazar -->
    <div id="rejectModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span>Rechazar Pago</span>
          <button class="close-btn" onclick="closeModal('rejectModal')">
            &times;
          </button>
        </div>
        <div id="rejectDetails"></div>
        <div class="form-group">
          <label>Motivo del rechazo:</label>
          <textarea
            id="rejectReason"
            placeholder="Explicar por qué se rechaza el pago..."
            required
          ></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-approve" onclick="closeModal('rejectModal')">
            Cancelar
          </button>
          <button class="btn btn-reject" onclick="submitRejection()">
            Rechazar
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentTeamId = null;
      let currentFilter = "pending";

      // Cargar datos al iniciar
      document.addEventListener("DOMContentLoaded", loadAllRegistrations);

      async function loadAllRegistrations() {
        try {
          const response = await fetch("/congreso/app/api/verify-payment.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": "XMLHttpRequest",
            },
            body: JSON.stringify({ action: "list_pending" }),
          });

          const result = await response.json();

          if (result.success) {
            displayRegistrations(result.data);
            calculateStats(result.data);
          } else {
            showError(result.error || "Error al cargar datos");
          }
        } catch (error) {
          showError(error.message);
        }
      }

      function displayRegistrations(data) {
        const tbody = document.getElementById("tableBody");

        if (data.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="8" class="loading">No hay registros pendientes</td></tr>';
          return;
        }

        tbody.innerHTML = data
          .map(
            (registration) => `
        <tr>
          <td><strong>${registration.folio}</strong></td>
          <td>${registration.captain_name}</td>
          <td>${registration.school_name}</td>
          <td>${registration.robot_count || 0}</td>
          <td>$${(registration.total_cost || 0).toLocaleString("es-MX")}</td>
          <td><span class="badge pending"><i class="fas fa-hourglass-half"></i> Pendiente</span></td>
          <td>${new Date(registration.created_at).toLocaleDateString("es-MX")}</td>
          <td>
            <div class="actions">
              <button class="btn btn-view" onclick="viewReceipt('${registration.receipt_filename}')">
                <i class="fas fa-file"></i> Ver
              </button>
              <button class="btn btn-approve" onclick="openVerifyModal(${registration.id}, '${registration.folio}')">
                <i class="fas fa-check"></i> Verificar
              </button>
              <button class="btn btn-reject" onclick="openRejectModal(${registration.id}, '${registration.folio}')">
                <i class="fas fa-times"></i> Rechazar
              </button>
            </div>
          </td>
        </tr>
      `,
          )
          .join("");
      }

      function calculateStats(data) {
        document.getElementById("pendingCount").textContent = data.length;

        let totalIncome = data.reduce(
          (sum, reg) => sum + (reg.total_cost || 0),
          0,
        );
        document.getElementById("totalIncome").textContent =
          "$" + totalIncome.toLocaleString("es-MX");
      }

      function openVerifyModal(teamId, folio) {
        currentTeamId = teamId;
        document.getElementById("verifyDetails").innerHTML = `
        <p><strong>Folio:</strong> ${folio}</p>
        <p><strong>Acción:</strong> Marcar este registro como pagado</p>
      `;
        document.getElementById("verifyNotes").value = "";
        document.getElementById("verifyModal").classList.add("active");
      }

      function openRejectModal(teamId, folio) {
        currentTeamId = teamId;
        document.getElementById("rejectDetails").innerHTML = `
        <p><strong>Folio:</strong> ${folio}</p>
        <p><strong>Acción:</strong> Rechazar este registro</p>
      `;
        document.getElementById("rejectReason").value = "";
        document.getElementById("rejectModal").classList.add("active");
      }

      async function submitVerification() {
        const notes =
          document.getElementById("verifyNotes").value || "Pago verificado";

        try {
          const response = await fetch("/congreso/app/api/verify-payment.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": "XMLHttpRequest",
            },
            body: JSON.stringify({
              action: "approve",
              team_id: currentTeamId,
              notes: notes,
            }),
          });

          const result = await response.json();

          if (result.success) {
            showSuccess(`Pago ${result.folio} verificado correctamente`);
            closeModal("verifyModal");
            loadAllRegistrations();
          } else {
            showError(result.error || "Error al verificar");
          }
        } catch (error) {
          showError(error.message);
        }
      }

      async function submitRejection() {
        const reason = document.getElementById("rejectReason").value;

        if (!reason.trim()) {
          showError("Debe proporcionar un motivo");
          return;
        }

        try {
          const response = await fetch("/congreso/app/api/verify-payment.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Requested-With": "XMLHttpRequest",
            },
            body: JSON.stringify({
              action: "reject",
              team_id: currentTeamId,
              reason: reason,
            }),
          });

          const result = await response.json();

          if (result.success) {
            showSuccess(`Pago ${result.folio} rechazado`);
            closeModal("rejectModal");
            loadAllRegistrations();
          } else {
            showError(result.error || "Error al rechazar");
          }
        } catch (error) {
          showError(error.message);
        }
      }

      function viewReceipt(filename) {
        if (filename) {
          window.open(`/congreso/app/uploads/receipts/${filename}`);
        } else {
          showError("Recibo no disponible");
        }
      }

      function filterRegistrations(status) {
        currentFilter = status;
        document.querySelectorAll(".filters button").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.classList.add("active");
        // TODO: Implementar filtrado real
        loadAllRegistrations();
      }

      function closeModal(modalId) {
        document.getElementById(modalId).classList.remove("active");
        currentTeamId = null;
      }

      function showError(message) {
        const errorDiv = document.getElementById("errorMessage");
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
        setTimeout(() => {
          errorDiv.style.display = "none";
        }, 5000);
      }

      function showSuccess(message) {
        const successDiv = document.getElementById("successMessage");
        successDiv.textContent = message;
        successDiv.style.display = "block";
        setTimeout(() => {
          successDiv.style.display = "none";
        }, 5000);
      }

      // Cerrar modales al hacer click fuera
      window.onclick = function (event) {
        const verifyModal = document.getElementById("verifyModal");
        const rejectModal = document.getElementById("rejectModal");

        if (event.target === verifyModal) {
          closeModal("verifyModal");
        }
        if (event.target === rejectModal) {
          closeModal("rejectModal");
        }
      };
    </script>
  </body>
</html>
